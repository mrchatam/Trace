name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-test:
    name: Go (CGO tests + vet + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install CGO toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++

      - name: Run Go CI script
        run: bash scripts/ci-go-test.sh

  # Pure-Go floor: these library packages promise CGO_ENABLED=0 buildability
  # (README “CGO” bullet). DetectLanguage extraction (langdetect) exists exactly
  # so detection-only consumers do not link the tree-sitter graph; build-only,
  # because some of these packages' tests import the CGO analyzers.
  go-pure:
    name: Go (CGO_ENABLED=0 library build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build pure-Go libraries without CGO
        run: |
          CGO_ENABLED=0 go build \
            ./internal/store/ \
            ./internal/vcs/ \
            ./internal/gitcli/ \
            ./internal/deliberation/ \
            ./internal/langdetect/ \
            ./internal/indexwalk/ \
            ./internal/domain/

  # Race gate on the concurrency-carrying core (store locking, watch/heal
  # goroutines, httpapi handlers, MCP, loop apply). One runner per package:
  # raced domain/cmd-trace alone run 5-15 minutes, so a single sequential job
  # would flirt with the timeout. Requires CGO (race detector constraint), so
  # the toolchain install matches the go-test job.
  go-race:
    name: "Go (race: ${{ matrix.pkg }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - ./cmd/trace/
          - ./internal/analyzers/
          - ./internal/deliberation/
          - ./internal/domain/
          - ./internal/gitcli/
          - ./internal/indexwalk/
          - ./internal/langdetect/
          - ./internal/loop/
          - ./internal/mcp/
          - ./internal/httpapi/
          - ./internal/store/
          - ./internal/testrun/
          - ./internal/vcs/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install CGO toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++

      - name: go test -race ${{ matrix.pkg }}
        run: CGO_ENABLED=1 go test -race -count=1 -timeout=25m ${{ matrix.pkg }}

  web:
    name: Web (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci + build
        run: |
          npm ci
          npm run build

      - name: web lib node tests
        run: node --experimental-strip-types --test src/lib/*.test.ts

  embed-gui:
    name: Embed GUI (SPA → go:embed)
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install CGO toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++

      - name: embed-gui + compile check
        run: |
          bash scripts/embed-gui.sh
          test -f internal/httpapi/embeddist/index.html
          CGO_ENABLED=1 go build -o /dev/null ./cmd/trace

      - name: Assert embeddist tracked (no drift)
        run: |
          git diff --exit-code internal/httpapi/embeddist/ || (
            echo "::error::embeddist out of date — run scripts/embed-gui.sh and commit"
            exit 1
          )

  openapi:
    name: OpenAPI sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test -f api/openapi.yaml && grep -q 'BoundedGraph' api/openapi.yaml

  # Advisory extended gates (compat Phase 29 HTTP policy + perf ladder).
  # Required merge path: go-test, go-pure, go-race, web, embed-gui, openapi above.
  evals-extended:
    name: Evals (compat + perf gates)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install CGO toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++

      - name: compat + perf evals
        run: CGO_ENABLED=1 go test ./evals/compat/... ./evals/perf/... -count=1 -timeout=20m
