components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Required when `trace serve` binds non-loopback (`--allow-remote`).
        On loopback, authentication may be omitted (loopback-trust). Optional
        loopback token is not required for MVP.

  parameters:
    TaskIdPath:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable code (e.g. VALIDATION_ERROR)
            message:
              type: string
            details:
              description: Optional structured context
              nullable: true

    HealthResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    VersionResponse:
      type: object
      required: [ok, name, api_version, trace_version]
      properties:
        ok:
          type: boolean
        name:
          type: string
          example: trace
        api_version:
          type: string
          description: HTTP contract version
          example: "1.0.0"
        trace_version:
          type: string
          description: Trace binary / build version

    ProjectResponse:
      type: object
      required: [root, store_ready]
      properties:
        root:
          type: string
          description: Absolute project root
        store_path:
          type: string
          description: Path to `.trace/` (may be omitted if sensitive in remote mode)
        store_ready:
          type: boolean
        flags:
          type: object
          additionalProperties: true
          description: Safe UI feature flags only

    TaskRow:
      type: object
      required: [id, title, work_state]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        work_state:
          type: string
        goal_id:
          type: string
          format: uuid
          nullable: true
        body:
          type: string
          nullable: true

    TaskListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskRow"
        next_cursor:
          type: string
          nullable: true

    EntitySummary:
      type: object
      required: [id, kind, title]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: goal|task|decision|assumption|discovery|plan-change|claim|evidence|…
        title:
          type: string
        body:
          type: string
          nullable: true
        work_state:
          type: string
          nullable: true

    CreateEntityRequest:
      type: object
      required: [kind, title]
      properties:
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
        source_type:
          type: string
        confidence:
          type: number
        status:
          type: string

    CreateLinkRequest:
      type: object
      required: [rel, from, to]
      properties:
        rel:
          type: string
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid
        source_type:
          type: string

    LinkSummary:
      type: object
      required: [rel, from, to]
      properties:
        rel:
          type: string
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid

    CreateTransitionRequest:
      type: object
      required: [task_id, to_state, reason]
      properties:
        task_id:
          type: string
          format: uuid
        to_state:
          type: string
        reason:
          type: string
        actor:
          type: string
          description: Provenance label only — not authorization
        allow_done:
          type: boolean
        as_operator:
          type: boolean
        allow_missing_caps:
          type: boolean
        evidence_ids:
          type: array
          items:
            type: string
            format: uuid

    TransitionResult:
      type: object
      required: [task_id, work_state]
      properties:
        task_id:
          type: string
          format: uuid
        work_state:
          type: string
        warning:
          type: string
          nullable: true

    LoopStatusResponse:
      type: object
      additionalProperties: true
      description: Maps from loop.Status library JSON (trace.loop.status.v1)
      properties:
        advisories:
          type: array
          items:
            $ref: "#/components/schemas/LoopStatusAdvisory"

    LoopStatusAdvisory:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Advisory code (e.g. goal_structure_warning, bootstrap_recommended)
        message:
          type: string

    PlanBootstrapRequest:
      type: object
      required: [goal_id]
      properties:
        goal_id:
          type: string
          format: uuid

    PlanBootstrapResult:
      type: object
      required: [goal_id, already_exists]
      properties:
        goal_id:
          type: string
          format: uuid
        scope_id:
          type: string
          format: uuid
        already_exists:
          type: boolean
        note:
          type: string

    LoopNextResponse:
      type: object
      additionalProperties: true
      description: Schema TODO — map 1:1 from loop.BuildNextPacket JSON in S03

    LoopApplyEnvelope:
      type: object
      required: [schema_version, apply_id, seed]
      properties:
        schema_version:
          type: string
          description: Expected trace.loop.apply.v1
        apply_id:
          type: string
          format: uuid
        seed:
          type: object
          required: [task_id]
          properties:
            task_id:
              type: string
              format: uuid
            goal_id:
              type: string
              format: uuid
        writes:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Align field names to loop.ApplyEnvelope in S03; do not invent silent forks

    LoopApplyResult:
      type: object
      additionalProperties: true
      description: Schema TODO — map from loop.Apply result in S03

    LoopGateResponse:
      type: object
      additionalProperties: true
      description: Schema TODO — map 1:1 from trace.loop.gate.v1 / loop.EvaluateGate in S03

    LoopResetResponse:
      type: object
      additionalProperties: true
      description: Schema TODO — map from deliberation reset result in S03

    ContextPacket:
      type: object
      additionalProperties: true
      description: Bounded packet; depth/format params constrain size (Law 7)

    WhyPacket:
      type: object
      additionalProperties: true
      description: Bounded causal neighborhood (Law 6–7)

    SearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, kind, title]
            properties:
              id:
                type: string
                format: uuid
              kind:
                type: string
              title:
                type: string
              snippet:
                type: string
                nullable: true

    SeedStatus:
      type: object
      required: [ready]
      properties:
        ready:
          type: boolean
        last_export_at:
          type: string
          format: date-time
          nullable: true
        last_import_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
      description: Summary only — not a graph dump

    SeedExportRequest:
      type: object
      properties:
        output_path:
          type: string
          description: |
            Optional local path hint for CLI-parity export. Must resolve under the
            bound project root (or an explicit allowlisted export dir). Absolute
            paths outside the project MUST be rejected — especially under `--allow-remote`.
        strict:
          type: boolean
        task_id:
          type: string
          format: uuid

    SeedImportRequest:
      type: object
      required: [input_path]
      properties:
        input_path:
          type: string
          description: |
            Local path to seed JSON (server-local filesystem). Must resolve under
            the bound project root; path traversal / escape MUST be rejected.
            Prefer project-relative paths in clients.

    SeedJobStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, pending, failed]
        summary:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        entity_count:
          type: integer
          nullable: true
        link_count:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
      description: Status/summary — must not embed full seed document by default

    GraphNode:
      type: object
      required: [id, kind, title]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        title:
          type: string

    GraphEdge:
      type: object
      required: [rel, from, to]
      properties:
        rel:
          type: string
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid

    BoundedGraph:
      type: object
      required: [center, max_nodes, nodes, edges, truncated]
      properties:
        mode:
          type: string
          enum: [project]
          description: Present when mode=project was requested
        center:
          type: string
          format: uuid
        max_nodes:
          type: integer
        total_entities:
          type: integer
          description: Total project entities before truncation (mode=project only)
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
        truncated:
          type: boolean
          description: True if neighborhood or project graph exceeded budget

    ReviewSummary:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          nullable: true
        result:
          type: string
          enum: [PASS, FAIL, UNCERTAIN]
          nullable: true
        task_id:
          type: string
          format: uuid
          nullable: true
