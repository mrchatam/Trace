openapi: 3.1.0
info:
  title: Trace HTTP API
  version: 1.0.0
  summary: Local-first JSON API for Trace (opt-in via `trace serve`)
  description: |
    Versioned HTTP/JSON contract for Trace core. Default bind is loopback
    (`127.0.0.1`). Handlers and the browser GUI are adapters only (Law 19) —
    they call the canonical Go library / `.trace/` SQLite; they must not fork
    business logic or create a second source of truth.

    **Non-goals (explicit):**
    - No `POST /rpc` / MCP tools/call mirror for the browser (MCP stays stdio-local)
    - No default unbounded / full-graph dump (including seed export body over HTTP)
    - No multi-tenant hosting, OAuth, or billing routes in this phase
    - No CORS `Access-Control-Allow-Origin: *` (deny by default; same-origin SPA)

    Wave tags: `x-trace-wave: p0 | p1 | defer`. GUI relevance: `x-trace-gui: true`.
  contact:
    name: Trace
  license:
    name: See repository LICENSE

servers:
  - url: http://127.0.0.1:7432
    description: Local opt-in `trace serve` (placeholder port; CLI may choose another)

tags:
  - name: health
    description: Liveness
  - name: version
    description: API and binary identity
  - name: project
    description: Bound project / store readiness
  - name: tasks
    description: Task board list and detail
  - name: loop
    description: Loop next / apply / status (CLI/MCP parity)
  - name: entities
    description: Semantic entity create/get (`trace add` parity)
  - name: links
    description: Relation create (`trace link` parity)
  - name: transitions
    description: Work-state transitions (`trace transition` parity)
  - name: context
    description: Bounded progressive context packets
  - name: why
    description: Bounded causal explanation packets
  - name: search
    description: Search entry
  - name: seed
    description: Seed export/import status and summaries (not full-graph body)
  - name: graph
    description: Budgeted subgraph for GUI
  - name: reviews
    description: Review records (P1)
  - name: plans
    description: Plan tree (P1)
  - name: capability
    description: Capability catalog / decisions (P1)
  - name: impact
    description: Impact reports (P1)
  - name: changes
    description: Change listing (P1)
  - name: regressions
    description: Regression listing (P1)
  - name: agents
    description: Agent list / recommend (P1)
  - name: index
    description: Index status / reindex (P1 / defer UI)
  - name: auth
    description: Local token issue/rotate (P1)
  - name: deferred
    description: Explicitly deferred surfaces (backup, install, knowledge, eval, SSE)

security:
  - {}
  - bearerAuth: []

paths:
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      x-trace-wave: p0
      x-trace-gui: true
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/version:
    get:
      tags: [version]
      operationId: getVersion
      summary: API and Trace binary versions
      x-trace-wave: p0
      x-trace-gui: true
      security: []
      responses:
        "200":
          description: Version identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/project:
    get:
      tags: [project]
      operationId: getProject
      summary: Bound project root, store readiness, safe UI flags
      x-trace-wave: p0
      x-trace-gui: true
      responses:
        "200":
          description: Project meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks (mirrors `trace tasks` / `trace_tasks`)
      x-trace-wave: p0
      x-trace-gui: true
      parameters:
        - name: goal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional goal UUID filter
        - name: work_state
          in: query
          required: false
          schema:
            type: string
          description: Optional work_state filter
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor (optional; S03 may start unpaginated)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/tasks/{task_id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: Get one task by id
      x-trace-wave: p0
      x-trace-gui: true
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRow"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /v1/loop/status:
    get:
      tags: [loop]
      operationId: getLoopStatus
      summary: Loop status for a seed task (mirrors `trace_loop` action=status)
      x-trace-wave: p0
      x-trace-gui: true
      parameters:
        - name: task_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: goal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional; derived from task when omitted
      responses:
        "200":
          description: Loop status payload (library-shaped; schema TODO align S03)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopStatusResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/loop/next:
    get:
      tags: [loop]
      operationId: getLoopNext
      summary: Build next-work packet (mirrors `trace_loop` action=next)
      x-trace-wave: p0
      x-trace-gui: true
      parameters:
        - name: task_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Next packet (bounded; library-shaped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopNextResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/loop/apply:
    post:
      tags: [loop]
      operationId: postLoopApply
      summary: Apply loop envelope `trace.loop.apply.v1` (mirrors `trace_loop` action=apply)
      x-trace-wave: p0
      x-trace-gui: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoopApplyEnvelope"
      responses:
        "200":
          description: Apply result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopApplyResult"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /v1/loop/gate:
    get:
      tags: [loop]
      operationId: getLoopGate
      summary: Deliberation gate check (mirrors `trace loop gate`)
      description: |
        CLI-parity gate (`trace.loop.gate.v1`). MCP `trace_loop` does not expose gate;
        HTTP includes it because the library/CLI surface exists and the GUI loop console needs it.
      x-trace-wave: p0
      x-trace-gui: true
      parameters:
        - name: task_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: for
          in: query
          required: false
          schema:
            type: string
            enum: [orient, edit, execute, done, export]
            default: edit
          description: Gate context (CLI `--for`)
      responses:
        "200":
          description: Gate envelope (allowed + violations; schema TODO align S03)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopGateResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/loop/reset:
    post:
      tags: [loop]
      operationId: postLoopReset
      summary: Reset deliberation / saturation state (mirrors `trace loop reset`)
      description: |
        CLI-parity reset. MCP does not expose reset; HTTP includes it for GUI loop console.
      x-trace-wave: p0
      x-trace-gui: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Post-reset deliberation state (schema TODO align S03)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopResetResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/entities:
    post:
      tags: [entities]
      operationId: createEntity
      summary: Create entity (`trace add` / `trace_add` parity)
      x-trace-wave: p0
      x-trace-gui: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityRequest"
      responses:
        "201":
          description: Created entity summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitySummary"
        default:
          $ref: "#/components/responses/Error"

  /v1/entities/{entity_id}:
    get:
      tags: [entities]
      operationId: getEntity
      summary: Get entity by id
      x-trace-wave: p0
      x-trace-gui: true
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entity summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitySummary"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /v1/links:
    post:
      tags: [links]
      operationId: createLink
      summary: Create relation (`trace link` / `trace_link` parity)
      x-trace-wave: p0
      x-trace-gui: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: Created link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkSummary"
        default:
          $ref: "#/components/responses/Error"

  /v1/transitions:
    post:
      tags: [transitions]
      operationId: createTransition
      summary: Apply work_state transition (`trace transition` / `trace_transition` parity)
      x-trace-wave: p0
      x-trace-gui: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransitionRequest"
      responses:
        "200":
          description: Transition applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /v1/context:
    get:
      tags: [context]
      operationId: getContext
      summary: Bounded context packet (mirrors `trace context` / `trace_context`)
      x-trace-wave: p0
      x-trace-gui: true
      parameters:
        - name: task_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: 1=TaskContext 2=ExpandContext; max 2
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, markdown, both]
            default: json
        - name: include_why
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Bounded context packet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextPacket"
        default:
          $ref: "#/components/responses/Error"

  /v1/why:
    get:
      tags: [why]
      operationId: getWhy
      summary: Bounded why packet (mirrors `trace why` / `trace_why`)
      x-trace-wave: p0
      x-trace-gui: true
      parameters:
        - name: entity_type
          in: query
          required: true
          schema:
            type: string
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bounded causal neighborhood
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhyPacket"
        default:
          $ref: "#/components/responses/Error"

  /v1/search:
    get:
      tags: [search]
      operationId: search
      summary: Search query (mirrors `trace search` / `trace_search`)
      x-trace-wave: p0
      x-trace-gui: true
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/seed/status:
    get:
      tags: [seed]
      operationId: getSeedStatus
      summary: Seed export/import readiness summary (not a full graph body)
      x-trace-wave: p0
      x-trace-gui: true
      responses:
        "200":
          description: Seed status / summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedStatus"
        default:
          $ref: "#/components/responses/Error"

  /v1/seed/export:
    post:
      tags: [seed]
      operationId: postSeedExport
      summary: Start or request seed export job; returns status/summary — not default full-graph body
      description: |
        HTTP must not return an unbounded full-graph document as the default success body.
        Prefer job status + path/size/summary fields; file write remains a local/CLI concern unless
        a future bounded artifact download is explicitly designed.
      x-trace-wave: p0
      x-trace-gui: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeedExportRequest"
      responses:
        "200":
          description: Export status / summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedJobStatus"
        "202":
          description: Export accepted (async)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedJobStatus"
        default:
          $ref: "#/components/responses/Error"

  /v1/seed/import:
    post:
      tags: [seed]
      operationId: postSeedImport
      summary: Start or request seed import; returns status/summary
      x-trace-wave: p0
      x-trace-gui: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeedImportRequest"
      responses:
        "200":
          description: Import status / summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedJobStatus"
        "202":
          description: Import accepted (async)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedJobStatus"
        default:
          $ref: "#/components/responses/Error"

  /v1/graph:
    get:
      tags: [graph]
      operationId: getGraph
      summary: Budgeted subgraph — neighborhood or project-wide
      description: |
        Requires explicit `max_nodes`. For neighborhood drill-down, pass `center` (entity id).
        For the full project graph (Explore default), pass `mode=project` without `center`.
        Servers MUST reject unbounded requests (hard cap 5000 nodes).
      x-trace-wave: p0
      x-trace-gui: true
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [project]
          description: When `project`, returns all entities (bounded by max_nodes) with edges between them
        - name: center
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Center entity id (required unless mode=project)
        - name: max_nodes
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5000
          description: Hard node budget (required; no implicit unlimited)
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 2
          description: Hop depth for neighborhood mode only
      responses:
        "200":
          description: Budgeted nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoundedGraph"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  # --- P1 ---
  /v1/reviews:
    get:
      tags: [reviews]
      operationId: listReviews
      summary: List reviews
      x-trace-wave: p1
      x-trace-gui: true
      parameters:
        - name: task_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Review list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewSummary"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [reviews]
      operationId: createReview
      summary: Create review (`trace review` create)
      x-trace-wave: p1
      x-trace-gui: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                body:
                  type: string
                task_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"
        default:
          $ref: "#/components/responses/Error"

  /v1/reviews/{review_id}:
    get:
      tags: [reviews]
      operationId: getReview
      summary: Get review
      x-trace-wave: p1
      x-trace-gui: true
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"
        default:
          $ref: "#/components/responses/Error"

  /v1/plans:
    get:
      tags: [plans]
      operationId: listPlans
      summary: Plan tree / plan listing (separate from budgeted graph)
      x-trace-wave: p1
      x-trace-gui: true
      responses:
        "200":
          description: Plan tree summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Schema TODO — align to library plan tree in S03/S05
        default:
          $ref: "#/components/responses/Error"

  /v1/plans/bootstrap:
    post:
      tags: [plans]
      operationId: bootstrapPlan
      summary: Bootstrap progressive plan from goal-linked plan_changes
      x-trace-wave: p1
      x-trace-gui: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanBootstrapRequest"
      responses:
        "200":
          description: Bootstrap result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanBootstrapResult"
        default:
          $ref: "#/components/responses/Error"

  /v1/capability:
    get:
      tags: [capability]
      operationId: listCapability
      summary: Capability list / decisions
      x-trace-wave: p1
      x-trace-gui: true
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [list, missing]
        - name: task_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Capability payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"

  /v1/impact:
    get:
      tags: [impact]
      operationId: getImpact
      summary: Impact report
      x-trace-wave: p1
      x-trace-gui: true
      parameters:
        - name: task_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Impact report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"

  /v1/changes:
    get:
      tags: [changes]
      operationId: listChanges
      summary: Change listing
      x-trace-wave: p1
      x-trace-gui: true
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"

  /v1/regressions:
    get:
      tags: [regressions]
      operationId: listRegressions
      summary: Regression listing
      x-trace-wave: p1
      x-trace-gui: true
      responses:
        "200":
          description: Regressions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"

  /v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List / recommend agents
      x-trace-wave: p1
      x-trace-gui: true
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [list, recommend]
            default: list
        - name: task_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agents payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"

  /v1/index:
    get:
      tags: [index]
      operationId: getIndexStatus
      summary: Index status
      x-trace-wave: p1
      x-trace-gui: false
      responses:
        "200":
          description: Index status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [index]
      operationId: postIndexReindex
      summary: Trigger reindex (ops)
      x-trace-wave: defer
      x-trace-gui: false
      responses:
        "202":
          description: Reindex accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/token:
    post:
      tags: [auth]
      operationId: postAuthToken
      summary: Issue or rotate local serve bearer token (non-loopback / optional)
      x-trace-wave: p1
      x-trace-gui: false
      responses:
        "200":
          description: Token issued (printed once; treat as secret)
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
        default:
          $ref: "#/components/responses/Error"

  # --- Deferred (explicit stubs) ---
  /v1/backup:
    post:
      tags: [deferred]
      operationId: postBackup
      summary: Backup (deferred — CLI-first)
      x-trace-wave: defer
      x-trace-cloud: true
      responses:
        "501":
          $ref: "#/components/responses/Error"

